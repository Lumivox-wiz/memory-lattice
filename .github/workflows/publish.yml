name: publish

# 用 npm Trusted Publishing（OIDC）发布：不需要 NPM_TOKEN，也不需要 2FA 验证码。
# 前提：npm 包设置里已把本仓库 + 本工作流注册为 trusted publisher
#   npmjs.com → package/memory-lattice → Settings → Trusted Publisher → GitHub Actions
#   字段：owner=Lumivox-wiz / repo=memory-lattice / workflow=publish.yml / environment 留空
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC —— 缺了这行 npm 拿不到短期凭据，会退成 ENEEDAUTH

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 固定到 commit SHA（供应链：tag 可被移动，SHA 不可）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
        # 刻意不设 registry-url：设了会让 setup-node 注入占位 NODE_AUTH_TOKEN，
        # npm 见到该变量就走 token 认证，OIDC 交换不会发生（表现为 ENEEDAUTH）。

      # tag 与 package.json 版本不一致时拒绝发布：否则 tag 会指向一个名不副实的版本
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(npm pkg get version | tr -d '"')
          t=${GITHUB_REF_NAME#v}
          if [ "$v" != "$t" ]; then
            echo "package.json 版本 $v 与 tag $GITHUB_REF_NAME 不一致，拒绝发布"
            exit 1
          fi

      - run: npm install -g npm@latest # Trusted Publishing 需要 npm >= 11.5.1
      - run: npm ci
      - run: npm test # 发布前跑满守卫，红了就不发
      - run: npm publish # 无 token、无 --otp；provenance 自动生成
